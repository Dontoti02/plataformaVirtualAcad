; Pool de php-fpm.
;
; El servidor actual usa pm.max_children = 5, que es muy justo. Aquí los valores
; se ajustan por entorno desde el entrypoint (PHP_FPM_MAX_CHILDREN), porque el
; tamaño del VPS varía mucho de una institución a otra.
;
; Regla práctica: cada hijo consume ~60-90 MB. max_children ≈ (RAM libre) / 90 MB,
; dejando espacio para MySQL, Redis y el sistema.
[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}

; Recicla procesos: evita que una fuga de memoria acumule durante días.
pm.max_requests = 500

; Los logs van a stdout para que los recoja Docker.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
