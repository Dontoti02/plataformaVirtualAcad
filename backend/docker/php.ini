; Producción. Ver ANALISIS-Y-PLAN.md §3.8.
; En producción el CLI corre con memory_limit = -1 y max_execution_time = 0.
; Sin límite en FPM, una petición pesada puede tumbar el contenedor entero; con
; un VPS por institución eso es la institución completa caída.
memory_limit = 512M
max_execution_time = 120

; Decidido con el cliente: 100 MB por archivo. El servidor actual tenía 2 MB en
; CLI mientras cada institución anunciaba 1000 MB en su system_configuration —
; una promesa que nunca se cumplió. 100 MB es lo que de verdad se soporta.
; Caddy aplica el mismo tope (request_body max_size en el Caddyfile).
upload_max_filesize = 100M
post_max_size = 105M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = America/Lima

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de una imagen: no hace falta revalidar.
opcache.validate_timestamps = 0
opcache.save_comments = 1
